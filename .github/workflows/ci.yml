name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      - name: Pytest again (determinism check)
        run: pytest -q
      - name: Install quality tools
        run: pip install ruff bandit mypy
      # Non-blocking until a clean run has been seen; then drop continue-on-error.
      - name: Ruff check
        continue-on-error: true
        run: ruff check .
      - name: Ruff format
        continue-on-error: true
        run: ruff format --check .
      - name: Bandit
        continue-on-error: true
        run: bandit -r lab/ -ll
      - name: Mypy strict
        continue-on-error: true
        run: mypy lab/ --strict
